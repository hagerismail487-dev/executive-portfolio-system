<svg
  xmlns="http://www.w3.org/2000/svg"
  width="800"
  height="800"
  viewBox="0 0 800 800"
  fill="none"
>
  <defs>
    <radialGradient
      id="executiveGlow"
      cx="50%"
      cy="50%"
      r="50%"
    >
      <stop
        offset="0%"
        stop-color="#2F6BFF"
        stop-opacity="0.18"
      />

      <stop
        offset="35%"
        stop-color="#4A8BFF"
        stop-opacity="0.10"
      />

      <stop
        offset="70%"
        stop-color="#8FB8FF"
        stop-opacity="0.04"
      />

      <stop
        offset="100%"
        stop-color="#FFFFFF"
        stop-opacity="0"
      />
    </radialGradient>
  </defs>

  <rect
    width="800"
    height="800"
    fill="url(#executiveGlow)"
  />
</svg>
